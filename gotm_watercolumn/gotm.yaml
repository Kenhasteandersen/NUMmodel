title: NUMmodel GOTM water column
version: 7

location:
  name: NorthSea
  latitude: 59.0
  longitude: 0.0
  depth: 100.0

time:
  start: 2000-01-01 00:00:00
  stop:  2002-01-01 00:00:00
  dt: 3600.0

grid:
  nlev: 50
  method: 0
  ddu: 0.0
  ddl: 0.0

temperature:
  method: file
  file: init_temp.dat
  column: 1
  relax:
    tau: 1.0e+15

salinity:
  method: constant
  constant_value: 34.5
  relax:
    tau: 1.0e+15

turbulence:
  turb_method: 3
  tke_method: 2
  len_scale_method: 8
  stab_method: 3

surface:
  fluxes:
    method: fairall
    heat:
      method: constant
      constant_value: 0.0
    tx:
      method: constant
      constant_value: 0.0
    ty:
      method: constant
      constant_value: 0.0
  u10:
    method: file
    file: meteo.dat
    column: 1
  v10:
    method: file
    file: meteo.dat
    column: 2
  airt:
    method: file
    file: meteo.dat
    column: 3
  hum:
    method: file
    file: meteo.dat
    column: 4
    type: relative
  cloud:
    method: file
    file: meteo.dat
    column: 5
  swr:
    method: file
    file: meteo.dat
    column: 6
  precip:
    method: constant
    constant_value: 0.0
  longwave_radiation:
    method: Berliand_Berliand

light_extinction:
  method: 7      # 7 = custom double-exponential
  A:
    method: 0
    constant_value: 0.6
  g1:
    method: 0
    constant_value: 0.35
  g2:
    method: 0
    constant_value: 23.0

bottom:
  h0b: 0.002

fabm:
  use: true
  freshwater_impact: false
  repair_state: true

output:
  NUMmodel_watercolumn:
    format: netcdf
    time_unit: hour
    time_step: 24
    variables:
    - source: temp
    - source: salt
    - source: num_model_N
    - source: num_model_DOC
    - source: num_model_Si
    - source: num_model_ProdGross
    - source: num_model_ProdNet
    - source: num_model_ProdHTL
    - source: num_model_Bpico
    - source: num_model_Bnano
    - source: num_model_Bmicro
    - source: num_model_BGen1
    - source: num_model_BDia1
    - source: num_model_BPCop1
    - source: num_model_BPCop2
    - source: num_model_BACop1
    - source: num_model_BACop2
    - source: num_model_BACop3
    - source: num_model_BPOM1
